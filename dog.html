<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f4ec"><title>Dog Profile - Haneul Tails Rescue</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/enhancements.css"><link rel="stylesheet" href="/interactions.css"><link rel="stylesheet" href="/forms.css"><link rel="stylesheet" href="/adoption.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Pet","name":"","description":"","status":"","photo":{"@type":"ImageObject","url":""},"url":"","provider":{"@type":"Organization","name":"Haneul Tails Rescue","url":"https://haneultailsrescue.pp.ua"}}</script></head>
<body data-page="profile"><div id="app" aria-busy="true"><div class="loading-state" role="status"><span aria-hidden="true">🐾</span><span>Opening the local preview…</span></div></div><script src="/adoption-ui.js" defer></script><script src="/app.js" defer></script><script src="/motion.js" defer></script><script>document.addEventListener('DOMContentLoaded',()=>{const el=document.querySelector('script[type="application/ld+json"]');if(!el)return;try{const data=JSON.parse(el.textContent);fetch('/api/all-dogs').then(r=>r.json()).then(dogs=>{const dog=dogs.find(d=>d.id===new URLSearchParams(location.search).get('id'));if(!dog)return;data.name=dog.name||'';data.description=dog.description||dog.temperament||'';data.status=dog.status==='available'?'Adoptable':dog.status==='reserved'?'Reserved':dog.status==='adopted'?'Adopted':'';const photo=dog.photo||(dog.photos&&dog.photos[0])||'';data.photo.url=photo;data.url=`https://haneultailsrescue.pp.ua/dog/${encodeURIComponent(dog.id)}`;el.textContent=JSON.stringify(data)})}catch{}})();</script></body>
</html>
